name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: Logic QA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0.1"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy

      - name: Cache Mix and Cargo builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            ~/.hex
            native/iroh_beam_nif/target
          key: ${{ runner.os }}-qa-v1-otp29-elixir1.20-rust1.91-${{ hashFiles('mix.lock', 'native/iroh_beam_nif/Cargo.lock') }}

      - name: Fetch locked dependencies
        run: |
          mix local.hex 2.5.1 --force
          MIX_ENV=test mix deps.get
          cargo +1.91.0 fetch --manifest-path native/iroh_beam_nif/Cargo.toml --locked

      - name: Quality gate
        env:
          RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "true"
        run: bin/qa_check.sh
  checksum-manifest:
    name: Detect precompiled checksum
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      present: ${{ steps.checksum.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect published checksum manifest
        id: checksum
        shell: bash
        run: |
          shopt -s nullglob
          files=(checksum-*.exs)
          test "${#files[@]}" -le 1
          if test "${#files[@]}" -eq 1; then
            test "${files[0]}" = "checksum-Elixir.IrohBeam.Native.exs"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  precompiled-consumer:
    name: Precompiled consumer / ${{ matrix.target }}
    needs: checksum-manifest
    if: needs.checksum-manifest.outputs.present == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0.1"

      - name: Cache consumer dependencies and downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci/consumer/deps
            .ci/consumer/_build
            ~/.cache/rustler_precompiled
            ~/Library/Caches/rustler_precompiled
            ~/AppData/Local/rustler_precompiled
          key: precompiled-consumer-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('mix.lock', 'checksum-*.exs', 'lib/**/*.ex', 'mix.exs', 'bin/smoke_precompiled_consumer.exs') }}

      - name: Compile unpacked package without Rust and smoke public API
        shell: bash
        run: |
          no_rust="$PWD/.no-rust"
          mkdir -p "$no_rust"
          for command in cargo rustc; do
            cat > "$no_rust/$command" <<'EOF'
          #!/usr/bin/env bash
          echo "error: precompiled consumer attempted to invoke Rust" >&2
          exit 97
          EOF
            chmod +x "$no_rust/$command"
          done
          export PATH="$no_rust:$PATH"
          unset IROH_BEAM_BUILD RUSTLER_PRECOMPILED_FORCE_BUILD_ALL
          mix local.hex 2.5.1 --force

          rm -rf .ci/precompiled-package
          mkdir -p .ci/consumer
          mix hex.build --unpack --output .ci/precompiled-package
          test -f .ci/precompiled-package/checksum-Elixir.IrohBeam.Native.exs
          cat > .ci/consumer/mix.exs <<'EOF'
          defmodule IrohBeamConsumer.MixProject do
            use Mix.Project
            def project, do: [app: :iroh_beam_consumer, version: "0.0.0", elixir: "~> 1.20", deps: deps()]
            def application, do: [extra_applications: [:logger]]
            defp deps, do: [{:iroh_beam, path: Path.expand("../precompiled-package", __DIR__)}]
          end
          EOF

          cd .ci/consumer
          MIX_ENV=prod mix deps.get --only prod
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=prod mix run --no-start ../../bin/smoke_precompiled_consumer.exs
