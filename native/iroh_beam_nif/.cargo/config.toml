# Rust's musl targets default to static CRT linking, which cannot produce the
# shared library required by a NIF. Keep the CRT dynamic for Alpine artifacts.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
