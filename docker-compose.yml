name: iroh-beam

services:
  iroh-relay:
    image: n0computer/iroh-relay:v1.0.3@sha256:e9a7ba14287dd9693aca61c339b0d154456d6609f3818a0ef358b07b36aab9cc
    command: ["--dev", "--config-path", "/config/iroh-relay.toml"]
    environment:
      IROH_RELAY_ACCESS_TOKEN: iroh-beam-local-test-token-not-for-production
      RUST_LOG: info
    ports:
      - "127.0.0.1:3340:3340"
      - "127.0.0.1:9090:9090"
    volumes:
      - "./test/fixtures/iroh-relay.toml:/config/iroh-relay.toml:ro"
    restart: unless-stopped
